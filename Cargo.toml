[package]
name = "blogtato"
version = "0.1.25"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "A CLI RSS/Atom feed reader inspired by Taskwarrior"
repository = "https://github.com/kantord/blogtato"

[[bin]]
name = "blog"
path = "src/main.rs"

[dependencies]
synctato = "=0.1.13"
anyhow = "=1.0.102"
atom_syndication = "=0.12.9"
clap = { version = "=4.6.1", features = ["derive"] }
chrono = { version = "=0.4.44", features = ["serde"] }
ureq = "=3.3.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
itertools = "=0.15.0"
rss = "=2.0.13"
url = "=2.5.8"
dirs = "=6.0.0"
indicatif = "=0.18.6"
open = "=5.3.6"
rayon = "=1.12.0"
terminal_size = "=0.4.4"
unicode-width = "=0.2.2"
chumsky = "=0.13.0"
quick-xml = "=0.40.1"
url-normalize = "=0.1.1"

[dev-dependencies]
sha2 = "=0.11.0"
httpmock = "0.8"
tempfile = "3"
assert_cmd = "2"
libc = "0.2"
rusty-fork = "0.3"
rstest = "0.26"
